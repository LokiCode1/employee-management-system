spring.application.name=employeemanagmentsystem

server.port=${PORT:8080}

# H2 persistent file database (survives restarts)
# - Local default: ./data/emsdb
# - Render recommended (with persistent disk): /var/data/emsdb
spring.datasource.url=jdbc:h2:file:${EMS_DB_PATH:./data/emsdb}
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=${EMS_DB_USER:sa}
spring.datasource.password=${EMS_DB_PASSWORD:}
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# H2 Console (disable on Render unless you explicitly enable it)
spring.h2.console.enabled=${H2_CONSOLE_ENABLED:false}
spring.h2.console.path=/h2-console

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

spring.datasource.hikari.maximum-pool-size=10
