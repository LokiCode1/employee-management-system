<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" th:fragment="appLayout(content, pageTitle)">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${pageTitle} + ' | Employee Management'">Employee Management</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    boxShadow: {
                        soft: "0 10px 30px rgba(15, 23, 42, 0.08)"
                    }
                }
            }
        };
    </script>
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-slate-100 text-slate-900">
<div class="min-h-screen flex">
    <aside class="w-64 bg-slate-900 text-slate-100 p-6 flex flex-col">
        <div class="mb-10">
            <h1 class="text-xl font-semibold tracking-wide">EMS Studio</h1>
            <p class="text-sm text-slate-400 mt-1">Employee Workspace</p>
        </div>
        <nav class="space-y-2">
            <a th:href="@{/employees/dashboard}" class="flex items-center gap-3 px-3 py-2 rounded-lg bg-indigo-600/20 text-indigo-300">
                <i data-lucide="layout-dashboard" class="w-4 h-4"></i>
                <span>Dashboard</span>
            </a>
            <a th:href="@{/employees/dashboard}" class="flex items-center gap-3 px-3 py-2 rounded-lg hover:bg-slate-800 transition">
                <i data-lucide="users" class="w-4 h-4"></i>
                <span>Users</span>
            </a>
            <a href="#" class="flex items-center gap-3 px-3 py-2 rounded-lg hover:bg-slate-800 transition">
                <i data-lucide="bar-chart-3" class="w-4 h-4"></i>
                <span>Reports</span>
            </a>
            <a href="#" class="flex items-center gap-3 px-3 py-2 rounded-lg hover:bg-slate-800 transition">
                <i data-lucide="settings" class="w-4 h-4"></i>
                <span>Settings</span>
            </a>
        </nav>
        <div class="mt-auto text-xs text-slate-400">Built with Spring MVC + Thymeleaf</div>
    </aside>

    <div class="flex-1 flex flex-col">
        <header class="bg-white border-b border-slate-200 px-6 py-4">
            <div class="max-w-7xl mx-auto flex items-center justify-between gap-4">
                <form th:action="@{/employees/dashboard}" method="get" class="w-full max-w-xl">
                    <label class="relative block">
                        <span class="absolute inset-y-0 left-0 flex items-center pl-4 text-slate-400">
                            <i data-lucide="search" class="w-4 h-4"></i>
                        </span>
                        <input type="text"
                               name="q"
                               th:value="${searchQuery}"
                               placeholder="Search employees by name, email or city..."
                               class="w-full rounded-xl border border-slate-200 bg-slate-50 pl-11 pr-4 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent"/>
                    </label>
                </form>
                <a th:href="@{/employees/new}" class="inline-flex items-center gap-2 px-4 py-2 rounded-lg bg-indigo-600 text-white text-sm font-medium hover:bg-indigo-700 transition">
                    <i data-lucide="plus" class="w-4 h-4"></i>
                    Add Employee
                </a>
            </div>
        </header>

        <main class="flex-1 p-6">
            <div class="max-w-7xl mx-auto" th:replace="${content}"></div>
        </main>
    </div>
</div>
<script>
    lucide.createIcons();
</script>
</body>
</html>
