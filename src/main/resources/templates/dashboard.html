<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout :: appLayout(~{::section}, 'Dashboard')}">
<section>
    <div class="space-y-6">
        <div th:if="${successMessage}" class="rounded-xl border border-emerald-200 bg-emerald-50 text-emerald-700 px-4 py-3 text-sm" th:text="${successMessage}"></div>
        <div th:if="${errorMessage}" class="rounded-xl border border-rose-200 bg-rose-50 text-rose-700 px-4 py-3 text-sm" th:text="${errorMessage}"></div>

        <div class="grid grid-cols-1 md:grid-cols-3 gap-5">
            <div class="rounded-2xl bg-gradient-to-br from-indigo-600 to-indigo-500 text-white p-5 shadow-soft">
                <p class="text-sm text-indigo-100">Total Employees</p>
                <h3 class="text-3xl font-semibold mt-2" th:text="${totalEmployees}">0</h3>
            </div>
            <div class="rounded-2xl bg-gradient-to-br from-sky-500 to-cyan-500 text-white p-5 shadow-soft">
                <p class="text-sm text-cyan-100">Recent Hires</p>
                <h3 class="text-3xl font-semibold mt-2" th:text="${recentHires}">0</h3>
            </div>
            <div class="rounded-2xl bg-gradient-to-br from-violet-500 to-fuchsia-500 text-white p-5 shadow-soft">
                <p class="text-sm text-fuchsia-100">Active Companies</p>
                <h3 class="text-3xl font-semibold mt-2" th:text="${activeCompanies}">0</h3>
            </div>
        </div>

        <div class="rounded-2xl bg-white/70 backdrop-blur border border-white shadow-soft overflow-hidden">
            <div class="px-6 py-4 border-b border-slate-200 flex items-center justify-between">
                <h2 class="font-semibold text-slate-800">Employee Directory</h2>
                <span class="text-sm text-slate-500" th:text="'Showing ' + ${#lists.size(employees)} + ' records'">Showing 0 records</span>
            </div>
            <div class="overflow-x-auto">
                <table class="min-w-full text-sm">
                    <thead class="bg-slate-50 text-slate-600 uppercase text-xs tracking-wider">
                    <tr>
                        <th class="px-6 py-3 text-left">Emp ID</th>
                        <th class="px-6 py-3 text-left">Name</th>
                        <th class="px-6 py-3 text-left">Email</th>
                        <th class="px-6 py-3 text-left">City</th>
                        <th class="px-6 py-3 text-left">Company</th>
                        <th class="px-6 py-3 text-right">Actions</th>
                    </tr>
                    </thead>
                    <tbody class="divide-y divide-slate-100 text-slate-700">
                    <tr th:if="${#lists.isEmpty(employees)}">
                        <td colspan="6" class="px-6 py-10 text-center text-slate-400">No employees found.</td>
                    </tr>
                    <tr th:each="employee : ${employees}" class="hover:bg-slate-50/70 transition">
                        <td class="px-6 py-4 font-medium" th:text="${employee.empId}">1</td>
                        <td class="px-6 py-4" th:text="${employee.name}">Name</td>
                        <td class="px-6 py-4" th:text="${employee.email}">email@mail.com</td>
                        <td class="px-6 py-4" th:text="${employee.city}">City</td>
                        <td class="px-6 py-4" th:text="${employee.companyId}">1001</td>
                        <td class="px-6 py-4">
                            <div class="flex items-center justify-end gap-2">
                                <a th:href="@{'/employees/edit/' + ${employee.empId}}"
                                   class="inline-flex items-center gap-1 rounded-lg border border-indigo-200 text-indigo-600 px-3 py-1.5 hover:bg-indigo-50">
                                    <i data-lucide="pencil" class="w-3.5 h-3.5"></i>
                                    Edit
                                </a>
                                <a th:href="@{'/employees/delete/' + ${employee.empId}}"
                                   onclick="return confirm('Delete this employee?');"
                                   class="inline-flex items-center gap-1 rounded-lg border border-rose-200 text-rose-600 px-3 py-1.5 hover:bg-rose-50">
                                    <i data-lucide="trash-2" class="w-3.5 h-3.5"></i>
                                    Delete
                                </a>
                            </div>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</section>
</html>
